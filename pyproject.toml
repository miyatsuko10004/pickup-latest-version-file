[project]
name = "pickup-latest-version-file"
version = "0.1.0"
description = "ディレクトリ内のファイルを整理し、最新版のみを残して古いファイルをoldディレクトリに移動するツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = "."
